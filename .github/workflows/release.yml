name: Build & Publish Mobile Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v2.0.0)'
        required: true
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Build Release APKs
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/universal/release/app-universal-release.apk release_assets/Ragam.apk
          cp app/build/outputs/apk/arm64/release/app-arm64-release.apk release_assets/app-arm64-release.apk
          cp app/build/outputs/apk/armeabi/release/app-armeabi-release.apk release_assets/app-armeabi-release.apk
          cp app/build/outputs/apk/x86_64/release/app-x86_64-release.apk release_assets/app-x86_64-release.apk
          cp app/build/outputs/apk/x86/release/app-x86-release.apk release_assets/app-x86-release.apk

      - name: Publish GitHub Release to Public Repo (hxni444/Ragam)
        uses: softprops/action-gh-release@v2
        with:
          repository: hxni444/Ragam
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Ragam Mobile ${{ github.event.inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_assets/Ragam.apk
            release_assets/app-arm64-release.apk
            release_assets/app-armeabi-release.apk
            release_assets/app-x86_64-release.apk
            release_assets/app-x86-release.apk
